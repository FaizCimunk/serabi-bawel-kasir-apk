name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Serabi Bawel Kasir APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: 6. Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 7. Prepare APK File
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SerabiBawelKasir_v1.0.0.apk

      - name: 8. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerabiBawelKasir_v1.0.0
          path: dist/SerabiBawelKasir_v1.0.0.apk
          retention-days: 30

      - name: 9. Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Release Serabi Bawel Kasir POS v1.0.0
          body: |
            ## 🥞 Serabi Bawel & Wedang Geprek - Kasir POS APK v1.0.0
            
            Aplikasi Android Kasir Resmi khusus Tablet / HP Meja Kasir 10 Cabang Toko.
            
            ### Fitur Utama:
            - **Koneksi Native Bluetooth Thermal 58mm / 80mm** (Bluetooth Classic SPP).
            - **Sinyal Buka Laci Kasir Otomatis (RJ11)**.
            - **Auto-reconnect ke printer thermal** saat tablet dinyalakan.
            - **Tersinkronisasi Realtime** ke Database Cloud Supabase 10 Cabang.
            - **Kiosk / Fullscreen Mode** khusus transaksi toko.
            
            Unduh file `SerabiBawelKasir_v1.0.0.apk` di bawah dan install langsung pada tablet kasir Anda.
          files: dist/SerabiBawelKasir_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
